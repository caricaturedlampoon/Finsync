    <script>
      (function() {
        try {
          var stored = localStorage.getItem('finsync_store_v1') || localStorage.getItem('expense_manager_store_v1') || localStorage.getItem('expense_manager_v2');
          var isDark = true;
          if (stored) {
            var parsed = JSON.parse(stored);
            var theme = parsed && parsed.settings && parsed.settings.theme;
            if (theme === 'light') {
              isDark = false;
            } else if (theme === 'system') {
              isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            } else if (theme === 'dark') {
              isDark = true;
            }
          }
          var root = document.documentElement;
          var bg = isDark ? '#090d16' : '#f8fafc';
          if (isDark) {
            root.classList.add('dark');
            root.style.colorScheme = 'dark';
          } else {
            root.classList.remove('dark');
            root.style.colorScheme = 'light';
          }
          root.style.backgroundColor = bg;
          root.setAttribute('data-theme', isDark ? 'dark' : 'light');
          var metaTheme = document.querySelector('meta[name="theme-color"]');
          if (metaTheme) {
            metaTheme.setAttribute('content', bg);
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#090d16';
        }
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500 selection:text-white dark:bg-slate-950 dark:text-slate-100 min-h-screen">
